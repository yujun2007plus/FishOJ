{% extends "layout/basic.html" %}
{% block content %}
<div class="row">
  <div class="medium-10 medium-offset-1 columns">
    <h1>教学脚手架：{{ pid }} {{ pdoc.title if pdoc else '' }}</h1>
    <p><a href="/ide/{{ pid }}">打开做题页</a></p>
    <form method="post">
      <input type="hidden" name="csrfToken" value="{{ handler.csrfToken }}">
      <div class="section">
        <button type="submit" name="operation" value="fill_demo" class="rounded primary button">填入「三数最大值」示例</button>
      </div>
    </form>
    <form method="post">
      <input type="hidden" name="csrfToken" value="{{ handler.csrfToken }}">
      <div class="section">
        <label><input type="checkbox" name="enabled" value="on"{% if meta and meta.enabled %} checked{% endif %}> 开启教学模式</label>
        <label><input type="checkbox" name="tutorEnabled" value="on"{% if not meta or meta.tutorEnabled != false %} checked{% endif %}> 开启 AI Tutor</label>
        <p>教学目标（每行一条）</p>
        <textarea name="objectives" rows="3">{{ (meta.objectives or [])|join('\n') }}</textarea>
        <p>知识点（每行一条）</p>
        <textarea name="concepts" rows="3">{{ (meta.concepts or [])|join('\n') }}</textarea>
        <p>解题阶段（格式：id|标题）</p>
        <textarea name="stages" rows="6">{% for s in meta.stages or [] %}{{ s.id }}|{{ s.title }}
{% endfor %}</textarea>
        <p>核心阶段 id（无论脚手架多高都不直接写出答案）</p>
        <textarea name="protectedStages" rows="3">{{ (meta.protectedStages or [])|join('\n') }}</textarea>
        <p>常见错误（每行一条）</p>
        <textarea name="commonMistakes" rows="4">{{ (meta.commonMistakes or [])|join('\n') }}</textarea>
      </div>
      <div class="section">
        <h2>Python 脚手架 S0 / S1 / S3</h2>
        <p>S0 自己挑战</p>
        <textarea name="py0" rows="6">{{ py[0] | default('') }}</textarea>
        <p>S1 给点框架</p>
        <textarea name="py1" rows="8">{{ py[1] | default('') }}</textarea>
        <p>S3 陪我做</p>
        <textarea name="py3" rows="12">{{ py[3] | default('') }}</textarea>
        <h2>C++ 脚手架 S0 / S1 / S3</h2>
        <p>S0</p>
        <textarea name="cpp0" rows="8">{{ cpp[0] | default('') }}</textarea>
        <p>S1</p>
        <textarea name="cpp1" rows="10">{{ cpp[1] | default('') }}</textarea>
        <p>S3</p>
        <textarea name="cpp3" rows="14">{{ cpp[3] | default('') }}</textarea>
      </div>
      <button type="submit" name="operation" value="save" class="rounded primary button">保存</button>
    </form>
  </div>
</div>
{% endblock %}
