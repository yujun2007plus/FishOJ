<div id="content-aiAnalysis" class="problem_content" style="display:none;">
{% if not problemIdeCanSubmit %}
<div class="problem-ide-login-required-panel">
  <p>登录后即可使用 AI 分析。</p>
</div>
{% else %}
<div class="problem-ide-ai-panel">
  <div class="problem-ide-ai-panel__toolbar">
    <div id="problemIdeAiSubmitMeta" class="problem-ide-ai-panel__meta">
      <span class="problem-ide-ai-panel__meta-empty">请从「运行结果」或「历史提交」选择一条记录</span>
    </div>
    <div class="problem-ide-ai-panel__toolbar-right">
      <button type="button" id="problemIdeAiRerunBtn" class="history-ai-btn problem-ide-ai-panel__rerun-btn" hidden><span class="history-ai-btn__ico" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l1.35 4.42L18 8.5l-4.65 1.08L12 14l-1.35-4.42L6 8.5l4.65-1.08L12 3zm6 9l.9 2.95 3.1 1.05-3.1 1.05L18 21l-2.1-3.95L12 17.1l3.9-1.15L18 12z"/></svg></span>重新AI分析</button>
      <div id="aiAnalysisQuotaBar" class="ai-analysis-quota-bar problem-ide-ai-panel__quota" hidden></div>
    </div>
  </div>
  <div id="problemIdeAiStreamRoot" class="record-ai-stream-panel record-ai-stream-panel--await-start">
    <div class="record-ai-await-start"><span>选择提交后开始分析</span></div>
  </div>
</div>
{% endif %}
</div>
