{% extends "layout/basic.html" %}
{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&display=swap">
<div class="row">
  <div class="medium-12 columns">
    <p class="fish-md-edit__nav">
      <a href="{{ url('problem_edit', pid=pid) }}">返回编辑题目</a>
      ·
      <a href="/ide/{{ pid }}">做题页</a>
      ·
      <a href="{{ url('manage_coding_assist_problem', pid=pid) }}">脚手架</a>
      ·
      {{ pid }} {{ pdoc.title if pdoc else '' }}
    </p>
    <div class="markdown-body" id="markdown-body">
      <div class="section">
        <h3>题目描述</h3>
        <div class="section__body">
          <textarea data-editor data-markdown name="content">{{ content }}</textarea>
        </div>
      </div>
      <div class="section">
        <h3>题解内容</h3>
        <div class="section__body">
          <textarea data-editor data-markdown name="solContent">{{ solContent }}</textarea>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
