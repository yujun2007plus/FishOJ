<div class="faq-card">
  <div class="faq-title">常见问题</div>
  <div class="faq-item">
    <div class="faq-question">现在可以付款开通会员吗？<span class="faq-toggle">+</span></div>
    <div class="faq-answer">微信支付、拼团和核销还在开发中。页面已经接好会员状态与权益说明；支付上线后即可在本页开通。</div>
  </div>
  <div class="faq-item">
    <div class="faq-question">FishOJ 会员目前有哪些能力？<span class="faq-toggle">+</span></div>
    <div class="faq-answer">当前已接通的权益是在线 IDE 自测/提交冷却缩短至 1 秒起（域用户角色设为 vip）。课程、AI、答疑群等会陆续开放。</div>
  </div>
  <div class="faq-item">
    <div class="faq-question">如何把账号设为会员（开发阶段）？<span class="faq-toggle">+</span></div>
    <div class="faq-answer">管理员在域设置中新增 vip 角色，再把对应用户的角色改为 vip。之后会由支付/核销自动写入，不必手工改角色。</div>
  </div>
  <div class="faq-item">
    <div class="faq-question">会员是否会自动扣费？<span class="faq-toggle">+</span></div>
    <div class="faq-answer">不会。计划为一次购买、长期有效，不会自动续费。</div>
  </div>
  <div class="faq-item">
    <div class="faq-question">会员能否转让？<span class="faq-toggle">+</span></div>
    <div class="faq-answer">会员与账号绑定，不允许私下转让售卖。</div>
  </div>
</div>
